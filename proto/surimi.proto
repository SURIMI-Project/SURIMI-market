syntax = "proto3";

option csharp_namespace = "SurimiController";
option java_package = "eu.project.surimi";

package surimi;

import "google/protobuf/empty.proto";

// The workflow service definition.
service Workflow {
    // init
    rpc Init (InitRequest) returns (google.protobuf.Empty);
}

// The request message containing the config.
message InitRequest {
    string experiment_id = 1;
}