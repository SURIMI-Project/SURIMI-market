syntax = "proto3";

package market;

service MarketService {
    rpc SendUpdatePrices (EmptyRequest) returns (stream MarketMessage);
    rpc TriggerUpdate (EmptyRequest) returns (EmptyRequest);
    rpc StartSimulation (SimulationRequest) returns (EmptyRequest);
}

message EmptyRequest {}

message MarketMessage {
    string species_id = 1;
    string port_id = 2;
    double price = 3;
    string currency = 4;
    string measurement_unit = 5;
    string timestamp = 6;
;
}

message SimulationRequest {
    string simulation_type = 1;  // "1" for Simulation_1, "2" for Simulation_2
}