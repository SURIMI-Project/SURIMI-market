syntax = "proto3";

package surimi.v1;

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message BiomassGrid {
  string species_code = 1; // 3-alpha code of https://www.fao.org/fishery/en/collection/asfis
  repeated BiomassCell biomass_cells = 2;
}

message BiomassCell {// center of the cell
  double longitude = 1;
  double latitude = 2;
  double biomass = 3;
}

message BiomassSummary {
  string measurement_unit = 1; // https://ucum.org/ucum
  repeated BiomassGrid biomass_grids = 2;
}
