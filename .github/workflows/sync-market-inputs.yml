name: Sync SURIMI inputs

on:
  # Nightly schedule (GitHub uses UTC).
  # 02:00 UTC ≈ 03:00 CET (winter) and 04:00 CEST (summer).
  schedule:
    - cron: "0 2 * * *"
  # Allow manual runs
  workflow_dispatch:

# Needed to push commits to SURIMI-market
permissions:
  contents: write

concurrency:
  group: sync-surimi-inputs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo (SURIMI-market)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repo (SURIMI-western_med) with LFS (sparse)
        uses: actions/checkout@v4
        with:
          repository: Official-EwE/SURIMI-western_med
          path: source
          # Only fetch the folder we need
          sparse-checkout: |
            SURIMI-market_inputs
          sparse-checkout-cone: true
          # Ensure LFS files are real, not pointers
          lfs: true
          fetch-depth: 1
          # Token must have read access to the source repo
          token: ${{ secrets.SURIMI_SYNC_CSVS_TOKEN }}

      - name: Copy files if changed
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          src_dir="source/SURIMI-market_inputs"
          dest_dir="config"
          mkdir -p "$dest_dir"

          # Files we want to sync
          files=( "ports.csv" "prices.csv" "species.csv" )

          changed=0
          for f in "${files[@]}"; do
            src="${src_dir}/${f}"
            dest="${dest_dir}/${f}"

            if [[ ! -f "$src" ]]; then
              echo "ERROR: Source file not found: $src"
              exit 1
            fi

            if [[ -f "$dest" ]] && cmp -s "$src" "$dest"; then
              echo "No change in $f"
              continue
            fi

            echo "Updating $f"
            # Copy with safe permissions
            install -m 0644 "$src" "$dest"
            git add "$dest"
            changed=1
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push (only if changes)
        if: steps.sync.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync from SURIMI-western_med (ports.csv, prices.csv, species.csv)"
          git push

      - name: No changes
        if: steps.sync.outputs.changed != '1'
        run: echo "No changes detected. Nothing to commit."
