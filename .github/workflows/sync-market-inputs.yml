name: Scheduled sync of SURIMI input CSVs (with checksum detection)

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:       # allow manual run

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SURIMI-market
        uses: actions/checkout@v4
        with:
          path: surimi-market

      - name: Checkout SURIMI-western_med
        uses: actions/checkout@v4
        with:
          repository: Official-EwE/SURIMI-western_med
          path: surimi-western-med
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true  # Enable Git LFS file downloads

      - name: Download to temp and compare by checksum
        shell: bash
        working-directory: surimi-market
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p config
          tmpdir="$(mktemp -d)"

          declare -a FILES=("ports.csv" "prices.csv" "species.csv")
          SOURCE_DIR="../surimi-western-med/SURIMI-market_inputs"

          changes=0

          for file in "${FILES[@]}"; do
            src_file="${SOURCE_DIR}/${file}"
            tmp_file="${tmpdir}/${file}"
            dest_file="config/${file}"

            echo "Copying ${file} from ${SOURCE_DIR}..."
            
            # Check if source file exists
            if [[ ! -f "${src_file}" ]]; then
              echo "Error: Source file ${src_file} not found!"
              exit 1
            fi

            # Copy to temp file first
            cp -f "${src_file}" "${tmp_file}"

            # Compute SHA-256 for new and existing file (if any)
            new_sha="$(sha256sum "${tmp_file}" | awk '{print $1}')"
            if [[ -f "${dest_file}" ]]; then
              old_sha="$(sha256sum "${dest_file}" | awk '{print $1}')"
            else
              old_sha="(none)"
            fi

            if [[ "${old_sha}" != "${new_sha}" ]]; then
              echo "Change detected for ${file}: ${old_sha} -> ${new_sha}"
              mv -f "${tmp_file}" "${dest_file}"
              changes=1
            else
              echo "No change for ${file}"
            fi
          done

          # Optional: write an aggregate checksum file for visibility (not required)
          if [[ $changes -eq 1 ]]; then
            echo "Recomputing aggregate checksum for config files..."
            (cd config && sha256sum "${FILES[@]}" | sort -k2 > checksums.sha256)
          fi

          # Clean up temp
          rm -rf "${tmpdir}"

          # Mark a file change deliberately only if any file changed
          if [[ $changes -eq 0 ]]; then
            echo "No file changes detected."
          fi

      - name: Commit and push only if there are changes
        shell: bash
        working-directory: surimi-market
        run: |
          set -euo pipefail

          if git status --porcelain | grep -qE '^( M|A |D |R |?? )'; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"

            git add config
            git commit -m "Scheduled sync: update CSVs with checksum detection"
            git push
            echo "Changes committed and pushed."
          else
            echo "No changes to commit."
          fi
